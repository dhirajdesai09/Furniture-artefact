<x-dc>

<canvas ref="{{setCv}}" style="width:66px;height:66px;display:block;border-radius:50%"></canvas>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"t":{"editor":null},"$preview":{"width":66,"height":66}}'>
class Component extends DCLogic {
constructor(p){super(p);this.cv=null;this.setCv=el=>{this.cv=el;};}
componentDidMount(){this.paint();}
componentDidUpdate(pp){if(pp.t!==this.props.t)this.paint();}
paint(){const cv=this.cv;if(!cv)return;const S=132;cv.width=S;cv.height=S;const x=cv.getContext('2d'),t=+this.props.t||0;
let a=11+t*977;const R=()=>{a|=0;a=a+0x6D2B79F5|0;let q=Math.imul(a^a>>>15,1|a);q=q+Math.imul(q^q>>>7,61|q)^q;return((q^q>>>14)>>>0)/4294967296;};
const fill=c=>{x.fillStyle=c;x.fillRect(0,0,S,S);};
if(t===0){fill('#d9ceb9');const c=6;for(let i=0;i<S/c;i++)for(let j=0;j<S/c;j++){const over=(i+j)%2===0;x.fillStyle=over?'rgba(255,255,255,'+(.22+R()*.12)+')':'rgba(60,45,20,'+(.1+R()*.1)+')';if(over)x.fillRect(i*c+.5,j*c+1,c-1,c-2);else x.fillRect(i*c+1,j*c+.5,c-2,c-1);}}
else if(t===1){fill('#d4c7ac');for(let i=0;i<S;i+=2){x.fillStyle='rgba('+(R()>.5?'255,255,255':'70,50,20')+','+(.1+R()*.2)+')';x.fillRect(0,i,S,1+R()*1.5);}for(let i=0;i<S;i+=4){x.fillStyle='rgba(70,50,20,'+(.06+R()*.1)+')';x.fillRect(i,0,1+R(),S);}for(let k=0;k<90;k++){x.fillStyle='rgba('+(R()>.5?'255,255,255':'60,40,15')+','+(.25+R()*.25)+')';x.fillRect(R()*S,R()*S,6+R()*14,1.5+R()*2.5);}}
else if(t===2){fill('#aa9d88');const g=x.createLinearGradient(0,0,S,S);g.addColorStop(0,'rgba(255,255,255,.55)');g.addColorStop(.5,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(0,0,0,.35)');x.fillStyle=g;x.fillRect(0,0,S,S);for(let k=0;k<2500;k++){x.fillStyle=R()>.5?'rgba(255,255,255,.07)':'rgba(0,0,0,.07)';x.fillRect(R()*S,R()*S,1.5,1.5);}}
else if(t===3){fill('#e2d9c8');for(let k=0;k<520;k++){const cx=R()*S,cy=R()*S,r=2.5+R()*3.5,a0=R()*6.28;x.strokeStyle=R()>.45?'rgba(255,255,255,.75)':'rgba(120,105,80,.55)';x.lineWidth=1.8;x.beginPath();x.arc(cx,cy,r,a0,a0+3.6+R()*1.8);x.stroke();}}
else if(t===4){fill('#8a5a38');for(let k=0;k<260;k++){const cx=R()*S,cy=R()*S,r=3+R()*5;x.strokeStyle='rgba(40,20,8,.5)';x.lineWidth=1.3;x.beginPath();x.ellipse(cx,cy,r,r*(.7+R()*.3),R()*3,0,6.28);x.stroke();x.fillStyle='rgba(255,200,150,.07)';x.fill();}const g=x.createLinearGradient(0,0,S,S);g.addColorStop(0,'rgba(255,255,255,.22)');g.addColorStop(1,'rgba(0,0,0,.25)');x.fillStyle=g;x.fillRect(0,0,S,S);}
else if(t===5){fill('#cfc3ab');const w=22,h=11;for(let col=0;col*w<S+w;col++){const d=col%2?1:-1;for(let row=-2;row*h<S+h*2;row++){const X=col*w,Y=row*h,y0=Y+(d>0?0:h),y1=Y+(d>0?h:0);x.fillStyle=(row+col)%2?'#dbd0b9':'#b3a78f';x.beginPath();x.moveTo(X,y0);x.lineTo(X+w,y1);x.lineTo(X+w,y1+h*.9);x.lineTo(X,y0+h*.9);x.closePath();x.fill();x.strokeStyle='rgba(60,45,25,.35)';x.lineWidth=1;x.stroke();}}}
else if(t===6){fill('#b6a487');const wl=10;for(let i=0;i<S;i+=wl){const g=x.createLinearGradient(i,0,i+wl,0);g.addColorStop(0,'rgba(0,0,0,.28)');g.addColorStop(.45,'rgba(255,255,255,.28)');g.addColorStop(1,'rgba(0,0,0,.2)');x.fillStyle=g;x.fillRect(i,0,wl,S);}for(let k=0;k<1200;k++){x.fillStyle='rgba(0,0,0,.05)';x.fillRect(R()*S,R()*S,1,3);}}
else if(t===7){fill('#a99d8a');for(let i=0;i<S/3;i++)for(let j=0;j<S/3;j++){x.fillStyle=(i+j)%2?'rgba(255,255,255,.14)':'rgba(0,0,0,.14)';x.fillRect(i*3,j*3,3,3);}const cs=['#9a5b3b','#3d4a5c','#efe6d2','#6f7550','#7a3b3b'];for(let k=0;k<420;k++){x.fillStyle=cs[(R()*cs.length)|0];x.globalAlpha=.55+R()*.35;x.fillRect(R()*S,R()*S,2+R()*3,1.5+R()*2);}x.globalAlpha=1;}
else if(t===8){fill('#c9a074');for(let k=0;k<70;k++){x.strokeStyle='rgba(70,35,10,'+(.08+R()*.18)+')';x.lineWidth=.8+R()*2.4;const y=R()*S;x.beginPath();x.moveTo(0,y);x.bezierCurveTo(S*.3,y+R()*14-7,S*.7,y+R()*14-7,S,y+R()*8-4);x.stroke();}}
else if(t===9){fill('#efece7');for(let k=0;k<7;k++){x.strokeStyle='rgba(95,95,100,'+(.18+R()*.3)+')';x.lineWidth=.8+R()*2.2;let px=R()*S,py=0;x.beginPath();x.moveTo(px,py);for(let j=0;j<7;j++){px+=R()*60-30;py+=S/6;x.lineTo(px,py);}x.stroke();}}
else if(t===10){const g=x.createLinearGradient(0,0,S,S);g.addColorStop(0,'#dff0f2');g.addColorStop(1,'#8fb6bd');x.fillStyle=g;x.fillRect(0,0,S,S);x.fillStyle='rgba(255,255,255,.55)';x.beginPath();x.moveTo(0,S*.55);x.lineTo(S*.55,0);x.lineTo(S*.75,0);x.lineTo(0,S*.75);x.fill();}
else if(t===11){const g=x.createLinearGradient(0,0,S,0);g.addColorStop(0,'#55555b');g.addColorStop(.35,'#2a2a2e');g.addColorStop(1,'#141416');x.fillStyle=g;x.fillRect(0,0,S,S);x.fillStyle='rgba(255,255,255,.4)';x.fillRect(S*.22,0,S*.07,S);}
else{const g=x.createLinearGradient(0,0,S,S);g.addColorStop(0,'#eceef1');g.addColorStop(1,'#9aa0a7');x.fillStyle=g;x.fillRect(0,0,S,S);for(let i=0;i<S;i+=1){x.fillStyle='rgba('+(R()>.5?'255,255,255':'60,65,75')+','+(.04+R()*.1)+')';x.fillRect(0,i,S,1);}}
}
renderVals(){return {setCv:this.setCv};}
}
</script>
